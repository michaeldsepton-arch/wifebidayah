name: Build Bidayah Fitness APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Stamp build number
        run: sed -i "s/const APP_BUILD = 0;/const APP_BUILD = ${{ github.run_number }};/" www/js/version.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bidayah-fitness-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bidayah-fitness.apk
          gh release create "build-${{ github.run_number }}" bidayah-fitness.apk \
            --repo "${{ github.repository }}" \
            --title "Bidayah build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}. Install bidayah-fitness.apk on the phone."
